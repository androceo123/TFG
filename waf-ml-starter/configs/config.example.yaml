mode: passive          # passive | active
listen_host: 0.0.0.0
listen_port: 8080

# Where to forward traffic (your protected app)
upstream_base: "http://127.0.0.1:8000"

# Model settings
model_path: "models/ocsvm.joblib"
model_type: "ocsvm"    # ocsvm | multiclass | multilabel

# Decision thresholds (for ocsvm; -1 = anomaly, +1 = normal)
block_on_anomaly: true

# Logging
log_path: "logs/waf_events.jsonl"
